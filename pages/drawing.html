<!DOCTYPE html>
<html lang="gu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Drawing Zone</title><link rel="icon" href="../favicon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="../favicon.svg">
  <link rel="stylesheet" href="../style.css?v=11">
</head>
<body>
  <header class="hero">
    <div class="brand">🎨 Drawing Zone</div>
    <p>પેન, રંગ, ટેક્સ્ટ અને shapes સાથે drawing book જેવું page</p>
  </header>
  <nav id="nav"></nav>
  <main class="page draw-page">
    <aside class="draw-side card">
      <h2>🖼️ Reference</h2>
      <div id="refs" class="ref-grid"></div>
      <p class="muted">Reference પસંદ કરો અને સામે copy કરીને draw કરો.</p>
    </aside>

    <section class="draw-board card">
      <div class="draw-toolbar" role="toolbar" aria-label="Drawing tools">
        <div class="tool-group">
          <button type="button" class="tool active" data-tool="pen" title="Pen">✏️ Pen</button>
          <button type="button" class="tool" data-tool="highlighter" title="Highlighter">🖍️ Highlighter</button>
          <button type="button" class="tool" data-tool="eraser" title="Eraser">🧽 Eraser</button>
          <button type="button" class="tool" data-tool="line" title="Line">／ Line</button>
          <button type="button" class="tool" data-tool="rect" title="Rectangle">▭ Rect</button>
          <button type="button" class="tool" data-tool="circle" title="Circle">◯ Circle</button>
          <button type="button" class="tool" data-tool="fill" title="Fill">🪣 Fill</button>
          <button type="button" class="tool" data-tool="text" title="Text">🔤 Text</button>
        </div>

        <div class="tool-group">
          <label class="tool-label">Color
            <input id="color" type="color" value="#17324d" aria-label="Color">
          </label>
          <div class="swatches" id="swatches"></div>
          <label class="tool-label">Size
            <input id="size" type="range" min="1" max="40" value="4" aria-label="Brush size">
          </label>
          <span id="sizeValue" class="size-badge">4</span>
        </div>

        <div class="tool-group">
          <button type="button" class="btn secondary" id="undoBtn">↩ Undo</button>
          <button type="button" class="btn secondary" id="redoBtn">↪ Redo</button>
          <button type="button" class="btn secondary" id="clearBtn">Clear</button>
          <button type="button" class="btn" id="saveBtn">⬇ Save</button>
        </div>
      </div>

      <div class="canvas-shell">
        <canvas id="canvas" width="900" height="620" aria-label="Drawing page"></canvas>
      </div>
      <p class="muted draw-hint">Tip: Text tool પર click કરો, પછી page પર click કરીને લખો. Mobile પર finger થી draw કરી શકો છો.</p>
    </section>
  </main>
  <footer>© Alpha 25 Learning Lab</footer>
  <script src="../app.js?v=11"></script>
  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d', { willReadFrequently: true });
    const colorInput = document.getElementById('color');
    const sizeInput = document.getElementById('size');
    const sizeValue = document.getElementById('sizeValue');
    const swatches = document.getElementById('swatches');
    const refsBox = document.getElementById('refs');

    const COLORS = ['#17324d', '#0f766e', '#1d4ed8', '#b42318', '#f59e0b', '#7c3aed', '#16a34a', '#000000', '#ffffff'];
    const REFS = [
      { label: 'House', draw: (c, w, h) => { c.fillStyle='#f8fafc'; c.fillRect(0,0,w,h); c.fillStyle='#93c5fd'; c.fillRect(w*0.28,h*0.38,w*0.44,h*0.42); c.fillStyle='#f97316'; c.beginPath(); c.moveTo(w*0.22,h*0.38); c.lineTo(w*0.5,h*0.18); c.lineTo(w*0.78,h*0.38); c.closePath(); c.fill(); c.fillStyle='#92400e'; c.fillRect(w*0.45,h*0.55,w*0.1,h*0.25); c.fillStyle='#bfdbfe'; c.fillRect(w*0.34,h*0.48,w*0.1,h*0.1); c.fillRect(w*0.56,h*0.48,w*0.1,h*0.1); } },
      { label: 'Tree', draw: (c, w, h) => { c.fillStyle='#f8fafc'; c.fillRect(0,0,w,h); c.fillStyle='#92400e'; c.fillRect(w*0.46,h*0.48,w*0.08,h*0.32); c.fillStyle='#16a34a'; c.beginPath(); c.arc(w*0.5,h*0.38,w*0.2,0,Math.PI*2); c.fill(); c.beginPath(); c.arc(w*0.4,h*0.46,w*0.14,0,Math.PI*2); c.fill(); c.beginPath(); c.arc(w*0.6,h*0.46,w*0.14,0,Math.PI*2); c.fill(); } },
      { label: 'Sun', draw: (c, w, h) => { c.fillStyle='#e0f2fe'; c.fillRect(0,0,w,h); c.strokeStyle='#f59e0b'; c.lineWidth=4; for (let i=0;i<8;i++){ const a=i*Math.PI/4; c.beginPath(); c.moveTo(w*0.5+Math.cos(a)*w*0.18,h*0.45+Math.sin(a)*w*0.18); c.lineTo(w*0.5+Math.cos(a)*w*0.28,h*0.45+Math.sin(a)*w*0.28); c.stroke(); } c.fillStyle='#fbbf24'; c.beginPath(); c.arc(w*0.5,h*0.45,w*0.14,0,Math.PI*2); c.fill(); } },
      { label: 'Fish', draw: (c, w, h) => { c.fillStyle='#e0f2fe'; c.fillRect(0,0,w,h); c.fillStyle='#38bdf8'; c.beginPath(); c.ellipse(w*0.48,h*0.5,w*0.2,h*0.14,0,0,Math.PI*2); c.fill(); c.beginPath(); c.moveTo(w*0.28,h*0.5); c.lineTo(w*0.16,h*0.38); c.lineTo(w*0.16,h*0.62); c.closePath(); c.fill(); c.fillStyle='#0f172a'; c.beginPath(); c.arc(w*0.58,h*0.46,4,0,Math.PI*2); c.fill(); } },
      { label: 'Flower', draw: (c, w, h) => { c.fillStyle='#f8fafc'; c.fillRect(0,0,w,h); c.fillStyle='#16a34a'; c.fillRect(w*0.48,h*0.48,w*0.04,h*0.28); const petals=['#f472b6','#fb7185','#f9a8d4','#fda4af','#f472b6','#fb7185']; petals.forEach((col,i)=>{ const a=i*Math.PI/3; c.fillStyle=col; c.beginPath(); c.ellipse(w*0.5+Math.cos(a)*28,h*0.42+Math.sin(a)*28,18,12,a,0,Math.PI*2); c.fill(); }); c.fillStyle='#facc15'; c.beginPath(); c.arc(w*0.5,h*0.42,14,0,Math.PI*2); c.fill(); } },
      { label: 'Blank', draw: (c, w, h) => { c.fillStyle='#ffffff'; c.fillRect(0,0,w,h); } },
    ];

    let tool = 'pen';
    let drawing = false;
    let startX = 0;
    let startY = 0;
    let snapshot = null;
    let history = [];
    let redoStack = [];
    const maxHistory = 40;

    function cssSize() {
      const rect = canvas.getBoundingClientRect();
      return { width: rect.width, height: rect.height, left: rect.left, top: rect.top };
    }

    function fitCanvas() {
      const shell = canvas.parentElement;
      const width = Math.min(900, shell.clientWidth);
      const height = Math.round(width * 0.7);
      const prev = canvas.toDataURL();
      canvas.style.width = width + 'px';
      canvas.style.height = height + 'px';
      canvas.width = Math.round(width * devicePixelRatio);
      canvas.height = Math.round(height * devicePixelRatio);
      ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      const img = new Image();
      img.onload = () => {
        ctx.clearRect(0, 0, width, height);
        ctx.drawImage(img, 0, 0, width, height);
      };
      if (history.length) img.src = prev;
      else blankPage();
    }

    function blankPage() {
      const { width, height } = cssSize();
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, width, height);
      // notebook lines
      ctx.strokeStyle = '#e8eef5';
      ctx.lineWidth = 1;
      for (let y = 36; y < height; y += 28) {
        ctx.beginPath();
        ctx.moveTo(16, y);
        ctx.lineTo(width - 16, y);
        ctx.stroke();
      }
      ctx.strokeStyle = '#fecaca';
      ctx.beginPath();
      ctx.moveTo(56, 12);
      ctx.lineTo(56, height - 12);
      ctx.stroke();
    }

    function pushHistory() {
      history.push(canvas.toDataURL());
      if (history.length > maxHistory) history.shift();
      redoStack = [];
    }

    function restore(dataUrl) {
      const img = new Image();
      img.onload = () => {
        const { width, height } = cssSize();
        ctx.clearRect(0, 0, width, height);
        ctx.drawImage(img, 0, 0, width, height);
      };
      img.src = dataUrl;
    }

    function pos(e) {
      const rect = canvas.getBoundingClientRect();
      const p = e.touches ? e.touches[0] : e;
      return [p.clientX - rect.left, p.clientY - rect.top];
    }

    function currentColor() {
      return colorInput.value;
    }

    function currentSize() {
      return Number(sizeInput.value);
    }

    function setStrokeStyle() {
      if (tool === 'eraser') {
        ctx.globalCompositeOperation = 'destination-out';
        ctx.strokeStyle = 'rgba(0,0,0,1)';
        ctx.lineWidth = Math.max(8, currentSize() * 2);
        ctx.globalAlpha = 1;
      } else if (tool === 'highlighter') {
        ctx.globalCompositeOperation = 'source-over';
        ctx.strokeStyle = currentColor();
        ctx.lineWidth = Math.max(10, currentSize() * 2.5);
        ctx.globalAlpha = 0.35;
      } else {
        ctx.globalCompositeOperation = 'source-over';
        ctx.strokeStyle = currentColor();
        ctx.fillStyle = currentColor();
        ctx.lineWidth = currentSize();
        ctx.globalAlpha = 1;
      }
    }

    function takeSnapshot() {
      snapshot = ctx.getImageData(0, 0, canvas.width, canvas.height);
    }

    function putSnapshot() {
      if (snapshot) ctx.putImageData(snapshot, 0, 0);
    }

    function hexToRgba(hex) {
      const h = hex.replace('#', '');
      const full = h.length === 3 ? h.split('').map((c) => c + c).join('') : h;
      const num = parseInt(full, 16);
      return [(num >> 16) & 255, (num >> 8) & 255, num & 255, 255];
    }

    function floodFill(x, y, fillColor) {
      const { width, height } = canvas;
      const image = ctx.getImageData(0, 0, width, height);
      const data = image.data;
      const startX = Math.floor(x * devicePixelRatio);
      const startY = Math.floor(y * devicePixelRatio);
      if (startX < 0 || startY < 0 || startX >= width || startY >= height) return;
      const startPos = (startY * width + startX) * 4;
      const target = data.slice(startPos, startPos + 4);
      const fill = hexToRgba(fillColor);
      if (target[0] === fill[0] && target[1] === fill[1] && target[2] === fill[2] && target[3] === fill[3]) return;

      const match = (i) => data[i] === target[0] && data[i + 1] === target[1] && data[i + 2] === target[2] && data[i + 3] === target[3];
      const stack = [[startX, startY]];
      while (stack.length) {
        const [cx, cy] = stack.pop();
        let left = cx;
        while (left >= 0 && match((cy * width + left) * 4)) left--;
        left++;
        let spanUp = false;
        let spanDown = false;
        for (let i = left; i < width; i++) {
          const idx = (cy * width + i) * 4;
          if (!match(idx)) break;
          data[idx] = fill[0];
          data[idx + 1] = fill[1];
          data[idx + 2] = fill[2];
          data[idx + 3] = fill[3];
          if (cy > 0) {
            const up = match(((cy - 1) * width + i) * 4);
            if (up && !spanUp) { stack.push([i, cy - 1]); spanUp = true; }
            else if (!up) spanUp = false;
          }
          if (cy < height - 1) {
            const down = match(((cy + 1) * width + i) * 4);
            if (down && !spanDown) { stack.push([i, cy + 1]); spanDown = true; }
            else if (!down) spanDown = false;
          }
        }
      }
      ctx.putImageData(image, 0, 0);
    }

    function start(e) {
      const [x, y] = pos(e);
      if (tool === 'text') {
        const text = prompt('લખો / Type text:');
        if (text) {
          pushHistory();
          ctx.globalCompositeOperation = 'source-over';
          ctx.globalAlpha = 1;
          ctx.fillStyle = currentColor();
          ctx.font = `${Math.max(14, currentSize() * 4)}px "Segoe UI", "Noto Sans Gujarati", sans-serif`;
          ctx.fillText(text, x, y);
        }
        e.preventDefault();
        return;
      }
      if (tool === 'fill') {
        pushHistory();
        floodFill(x, y, currentColor());
        e.preventDefault();
        return;
      }
      drawing = true;
      startX = x;
      startY = y;
      pushHistory();
      setStrokeStyle();
      if (tool === 'pen' || tool === 'highlighter' || tool === 'eraser') {
        ctx.beginPath();
        ctx.moveTo(x, y);
      } else {
        takeSnapshot();
      }
      e.preventDefault();
    }

    function move(e) {
      if (!drawing) return;
      const [x, y] = pos(e);
      setStrokeStyle();
      if (tool === 'pen' || tool === 'highlighter' || tool === 'eraser') {
        ctx.lineTo(x, y);
        ctx.stroke();
      } else {
        putSnapshot();
        ctx.beginPath();
        if (tool === 'line') {
          ctx.moveTo(startX, startY);
          ctx.lineTo(x, y);
          ctx.stroke();
        } else if (tool === 'rect') {
          ctx.strokeRect(startX, startY, x - startX, y - startY);
        } else if (tool === 'circle') {
          const rx = (x - startX) / 2;
          const ry = (y - startY) / 2;
          ctx.beginPath();
          ctx.ellipse(startX + rx, startY + ry, Math.abs(rx), Math.abs(ry), 0, 0, Math.PI * 2);
          ctx.stroke();
        }
      }
      e.preventDefault();
    }

    function end() {
      drawing = false;
      snapshot = null;
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
    }

    document.querySelectorAll('.tool').forEach((btn) => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.tool').forEach((b) => b.classList.remove('active'));
        btn.classList.add('active');
        tool = btn.dataset.tool;
        canvas.style.cursor = tool === 'text' ? 'text' : tool === 'fill' ? 'cell' : 'crosshair';
      });
    });

    COLORS.forEach((color) => {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'swatch';
      btn.style.background = color;
      btn.title = color;
      btn.addEventListener('click', () => { colorInput.value = color; });
      swatches.appendChild(btn);
    });

    REFS.forEach((ref) => {
      const item = document.createElement('button');
      item.type = 'button';
      item.className = 'ref-card';
      const preview = document.createElement('canvas');
      preview.width = 140;
      preview.height = 100;
      ref.draw(preview.getContext('2d'), 140, 100);
      item.appendChild(preview);
      const label = document.createElement('span');
      label.textContent = ref.label;
      item.appendChild(label);
      item.addEventListener('click', () => {
        document.querySelectorAll('.ref-card').forEach((el) => el.classList.remove('active'));
        item.classList.add('active');
        pushHistory();
        const { width, height } = cssSize();
        ref.draw(ctx, width, height);
      });
      refsBox.appendChild(item);
    });

    sizeInput.addEventListener('input', () => { sizeValue.textContent = sizeInput.value; });
    document.getElementById('undoBtn').addEventListener('click', () => {
      if (!history.length) return;
      redoStack.push(canvas.toDataURL());
      restore(history.pop());
    });
    document.getElementById('redoBtn').addEventListener('click', () => {
      if (!redoStack.length) return;
      history.push(canvas.toDataURL());
      restore(redoStack.pop());
    });
    document.getElementById('clearBtn').addEventListener('click', () => {
      if (!confirm('Clear the page?')) return;
      pushHistory();
      blankPage();
    });
    document.getElementById('saveBtn').addEventListener('click', () => {
      const link = document.createElement('a');
      link.download = 'alpha25-drawing.png';
      link.href = canvas.toDataURL('image/png');
      link.click();
    });

    canvas.addEventListener('mousedown', start);
    canvas.addEventListener('mousemove', move);
    canvas.addEventListener('mouseup', end);
    canvas.addEventListener('mouseleave', end);
    canvas.addEventListener('touchstart', start, { passive: false });
    canvas.addEventListener('touchmove', move, { passive: false });
    canvas.addEventListener('touchend', end);

    window.addEventListener('resize', () => {
      clearTimeout(window.__drawResize);
      window.__drawResize = setTimeout(fitCanvas, 120);
    });

    fitCanvas();
    blankPage();
    pushHistory();
    history = [];
  </script>
</body>
</html>
