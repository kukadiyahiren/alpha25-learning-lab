<!DOCTYPE html><html lang="gu"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Drawing Zone</title><link rel="stylesheet" href="../style.css"></head><body><header class="hero"><div class="brand">🎨 Drawing Zone</div><p>Reference જુઓ અને freehand drawing કરો</p></header><nav id="nav"></nav><main class="page"><div class="drawwrap"><div class="card"><h2>🖼️ Reference Picture</h2><div style="font-size:180px;text-align:center">🏠</div><p>આ demo reference છે. assets/images માં તમારી પોતાની coloring/reference pictures મૂકી શકો છો.</p></div><div class="card"><h2>✏️ Blank Drawing Page</h2><canvas id="canvas"></canvas><button class="btn" onclick="ctx.clearRect(0,0,canvas.width,canvas.height)">Clear</button></div></div></main><footer>© Alpha 25 Learning Lab</footer><script src="../app.js?v=2"></script><script>const canvas=document.getElementById('canvas'),ctx=canvas.getContext('2d');function resize(){canvas.width=canvas.clientWidth*devicePixelRatio;canvas.height=420*devicePixelRatio;ctx.scale(devicePixelRatio,devicePixelRatio)}resize();let drawing=false;function pos(e){const r=canvas.getBoundingClientRect();const p=e.touches?e.touches[0]:e;return [p.clientX-r.left,p.clientY-r.top]}function start(e){drawing=true;const [x,y]=pos(e);ctx.beginPath();ctx.moveTo(x,y);e.preventDefault()}function move(e){if(!drawing)return;const [x,y]=pos(e);ctx.lineTo(x,y);ctx.stroke();e.preventDefault()}canvas.addEventListener('mousedown',start);canvas.addEventListener('mousemove',move);canvas.addEventListener('mouseup',()=>drawing=false);canvas.addEventListener('mouseleave',()=>drawing=false);canvas.addEventListener('touchstart',start,{passive:false});canvas.addEventListener('touchmove',move,{passive:false});canvas.addEventListener('touchend',()=>drawing=false);</script></body></html>
