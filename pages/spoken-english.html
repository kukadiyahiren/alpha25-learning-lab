<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Spoken English</title><link rel="icon" href="../favicon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="../favicon.svg">
  <link rel="stylesheet" href="../style.css?v=13">
</head>
<body>
  <header class="hero">
    <div class="brand">🗣️ Spoken English</div>
    <p>Topic-wise • Day-wise</p>
  </header>
  <nav id="nav"></nav>
  <main class="page"><div id="list" class="grid"></div></main>
  <footer>© Alpha 25 Learning Lab</footer>
  <script src="../app.js?v=13"></script>
  <script>
    loadJson('/spoken-english').then((lessons) => {
      const box = document.getElementById('list');
      if (!lessons.length) {
        box.innerHTML = emptyMessage('No spoken English lessons yet.');
        return;
      }
      box.innerHTML = lessons.map((lesson) => `
        <div class="card">
          <h2>${esc(lesson.day_label)}</h2>
          <h3>${esc(lesson.topic)}</h3>
          <p>${esc(lesson.script)}</p>
          ${audioBlock(lesson.audio_url)}
          ${speakButton(lesson.script || lesson.topic, 'en-IN', '🔊 Listen')}
        </div>
      `).join('');
    }).catch(() => {
      document.getElementById('list').innerHTML = emptyMessage('Could not load lessons. Check that the API is running.');
    });
  </script>
</body>
</html>
