<!DOCTYPE html>
<html lang="gu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>eBook Reader</title>
  <link rel="icon" href="../favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="../favicon.svg">
  <link rel="stylesheet" href="../style.css?v=18">
</head>
<body class="ebook-reader-page">
  <nav id="nav"></nav>

  <main class="ebook-shell">
    <header class="ebook-top">
      <a class="btn secondary small" href="ebooks.html">← Library</a>
      <div class="ebook-heading">
        <h1 id="bookTitle">Loading book…</h1>
        <p id="bookMeta" class="muted"></p>
      </div>
      <div class="ebook-top-actions">
        <a id="downloadBtn" class="btn secondary small" href="#" target="_blank" rel="noopener" hidden>Download PDF</a>
      </div>
    </header>

    <section class="ebook-toolbar" id="ebookToolbar" aria-label="Reader controls">
      <button type="button" class="tool" id="prevBtn" title="Previous page">‹ Prev</button>
      <label class="tool-label">
        Page
        <input id="pageInput" type="number" min="1" value="1">
        <span id="pageTotal">/ 1</span>
      </label>
      <button type="button" class="tool" id="nextBtn" title="Next page">Next ›</button>
      <span class="toolbar-gap"></span>
      <button type="button" class="tool" id="mode1Btn">1 page</button>
      <button type="button" class="tool active" id="mode2Btn">2 pages</button>
      <span class="toolbar-gap"></span>
      <select id="listenLang" aria-label="Listen language">
        <option value="gu-IN">Gujarati</option>
        <option value="hi-IN">Hindi</option>
        <option value="en-IN">English</option>
      </select>
      <button type="button" class="btn small" id="listenBtn">🔊 Listen page</button>
      <button type="button" class="btn secondary small" id="stopListenBtn">Stop</button>
    </section>

    <section class="ebook-stage ebook-stage-flip" id="stage">
      <div class="ebook-book-wrap">
        <div id="flipBook" class="ebook-flip-root"></div>
      </div>
      <iframe id="ebookEmbed" class="ebook-embed" title="PDF reader" hidden></iframe>
    </section>

    <p class="ebook-hint muted" id="ebookHint">Drag a page corner or tap the sides to flip — just like a real book.</p>
  </main>

  <footer>© Alpha 25 Learning Lab</footer>
  <script src="../app.js?v=18"></script>
  <script>
    (function () {
      const params = new URLSearchParams(location.search);
      const bookId = params.get('id');
      const startPage = Math.max(1, Number(params.get('page') || 1));
      const wantListen = location.hash === '#listen';

      const titleEl = document.getElementById('bookTitle');
      const metaEl = document.getElementById('bookMeta');
      const pageInput = document.getElementById('pageInput');
      const pageTotal = document.getElementById('pageTotal');
      const downloadBtn = document.getElementById('downloadBtn');
      const listenLang = document.getElementById('listenLang');
      const embedEl = document.getElementById('ebookEmbed');
      const hintEl = document.getElementById('ebookHint');
      const flipRoot = document.getElementById('flipBook');
      const mode1Btn = document.getElementById('mode1Btn');
      const mode2Btn = document.getElementById('mode2Btn');

      let pdfDoc = null;
      let pageFlip = null;
      let pageImages = [];
      let page = startPage;
      let usePortrait = params.get('mode') === '1up' || window.innerWidth < 820;
      if (params.get('mode') === '2up') usePortrait = false;
      let flipping = false;

      function candidatePdfUrls(book) {
        const urls = [];
        if (book?.id) {
          urls.push(`${API_ORIGIN}/api/book/${book.id}/pdf`);
          urls.push(`${API_ORIGIN}/api/ebooks/${book.id}/file`);
        }
        if (book?.file_path) {
          urls.push(`${API_ORIGIN}/api/public-file/${String(book.file_path).split('/').map(encodeURIComponent).join('/')}`);
        }
        return urls;
      }

      function loadScript(src) {
        return new Promise((resolve, reject) => {
          const existing = document.querySelector(`script[src="${src}"]`);
          if (existing) {
            resolve();
            return;
          }
          const script = document.createElement('script');
          script.src = src;
          script.onload = resolve;
          script.onerror = () => reject(new Error(`Failed to load ${src}`));
          document.head.appendChild(script);
        });
      }

      async function loadPdfJs() {
        if (window.pdfjsLib) return;
        await loadScript('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js');
        pdfjsLib.GlobalWorkerOptions.workerSrc =
          'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
      }

      async function loadPageFlip() {
        if (window.St && window.St.PageFlip) return;
        await loadScript('https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.js');
      }

      async function loadBook(id) {
        try {
          return await loadJson(`/book/${id}`, { silent: true });
        } catch {
          try {
            return await loadJson(`/ebooks/${id}`, { silent: true });
          } catch {
            const books = await loadJson('/ebooks', { silent: true });
            const book = (books || []).find((item) => String(item.id) === String(id));
            if (!book) throw new Error('Book not found');
            return book;
          }
        }
      }

      async function fetchPdfBuffer(book) {
        for (const url of candidatePdfUrls(book)) {
          try {
            const response = await fetch(url, { headers: { Accept: 'application/pdf' } });
            if (!response.ok) continue;
            const type = response.headers.get('content-type') || '';
            if (type.includes('application/json')) continue;
            return await response.arrayBuffer();
          } catch (error) {
            console.warn('PDF candidate failed', url, error);
          }
        }
        return null;
      }

      function setModeButtons() {
        mode1Btn.classList.toggle('active', usePortrait);
        mode2Btn.classList.toggle('active', !usePortrait);
      }

      function updateUrl() {
        const url = new URL(location.href);
        url.searchParams.set('id', String(bookId));
        url.searchParams.set('page', String(page));
        url.searchParams.set('mode', usePortrait ? '1up' : '2up');
        history.replaceState({ soft: true }, '', url);
      }

      function syncPageUi(index) {
        page = index + 1;
        pageInput.value = String(page);
        if (pdfDoc) pageTotal.textContent = `/ ${pdfDoc.numPages}`;
        updateUrl();
      }

      async function renderPdfPageToDataUrl(num, renderScale) {
        const pdfPage = await pdfDoc.getPage(num);
        const viewport = pdfPage.getViewport({ scale: renderScale });
        const canvas = document.createElement('canvas');
        canvas.width = viewport.width;
        canvas.height = viewport.height;
        await pdfPage.render({ canvasContext: canvas.getContext('2d'), viewport }).promise;
        return canvas.toDataURL('image/jpeg', 0.86);
      }

      async function buildPageImages() {
        const total = pdfDoc.numPages;
        const images = new Array(total).fill('');
        const first = await pdfDoc.getPage(1);
        const base = first.getViewport({ scale: 1 });
        const targetWidth = Math.min(900, Math.max(420, window.innerWidth * (usePortrait ? 0.72 : 0.42)));
        const renderScale = Math.min(2, Math.max(1.05, targetWidth / base.width));

        showKidsLoader(`Preparing pages 0/${total}…`);
        const batch = 3;
        for (let i = 1; i <= total; i += batch) {
          const jobs = [];
          for (let n = i; n < i + batch && n <= total; n += 1) {
            jobs.push(renderPdfPageToDataUrl(n, renderScale).then((url) => {
              images[n - 1] = url;
            }));
          }
          await Promise.all(jobs);
          setKidsLoaderMessage(`Preparing pages ${Math.min(i + batch - 1, total)}/${total}…`);
        }
        return images;
      }

      function bookSize() {
        const stage = document.getElementById('stage');
        const maxW = Math.min(980, stage.clientWidth - 24);
        const maxH = Math.min(720, window.innerHeight * 0.62);
        if (usePortrait) {
          const width = Math.min(460, maxW);
          const height = Math.min(maxH, Math.round(width * 1.35));
          return { width, height };
        }
        const width = Math.min(420, Math.floor(maxW / 2) - 8);
        const height = Math.min(maxH, Math.round(width * 1.35));
        return { width, height };
      }

      function destroyFlip() {
        if (pageFlip) {
          try { pageFlip.destroy(); } catch { /* ignore */ }
          pageFlip = null;
        }
        flipRoot.innerHTML = '';
      }

      function createFlipBook(images, startIndex) {
        destroyFlip();
        const size = bookSize();
        pageFlip = new St.PageFlip(flipRoot, {
          width: size.width,
          height: size.height,
          size: 'stretch',
          minWidth: 280,
          maxWidth: 1100,
          minHeight: 360,
          maxHeight: 900,
          drawShadow: true,
          flippingTime: 850,
          usePortrait,
          startPage: startIndex,
          autoSize: true,
          maxShadowOpacity: 0.45,
          showCover: true,
          mobileScrollSupport: false,
          swipeDistance: 30,
          useMouseEvents: true,
          disableFlipByClick: false,
          showPageCorners: true,
        });
        pageFlip.loadFromImages(images);
        pageFlip.on('flip', (event) => {
          syncPageUi(event.data);
          flipping = false;
        });
        pageFlip.on('changeOrientation', () => {
          /* keep selected mode via buttons */
        });
        syncPageUi(pageFlip.getCurrentPageIndex());
        setModeButtons();
      }

      async function rebuildFlip(keepPage) {
        if (!pageImages.length) return;
        const index = Math.max(0, Math.min(pageImages.length - 1, (keepPage || page) - 1));
        createFlipBook(pageImages, index);
      }

      function go(delta) {
        if (!pageFlip || flipping) return;
        flipping = true;
        if (delta > 0) pageFlip.flipNext('top');
        else pageFlip.flipPrev('top');
        window.setTimeout(() => { flipping = false; }, 900);
      }

      async function textForPages(nums) {
        const chunks = [];
        for (const num of nums) {
          if (!pdfDoc || num < 1 || num > pdfDoc.numPages) continue;
          const pdfPage = await pdfDoc.getPage(num);
          const content = await pdfPage.getTextContent();
          const text = content.items.map((item) => item.str).join(' ').replace(/\s+/g, ' ').trim();
          if (text) chunks.push(text);
        }
        return chunks.join('\n\n');
      }

      async function listenCurrent() {
        if (!pdfDoc) return;
        const current = pageFlip ? pageFlip.getCurrentPageIndex() + 1 : page;
        const pages = usePortrait
          ? [current]
          : [current % 2 === 0 ? current - 1 : current, (current % 2 === 0 ? current - 1 : current) + 1]
              .filter((n) => n >= 1 && n <= pdfDoc.numPages);
        showKidsLoader('Preparing listen…');
        try {
          const text = await textForPages([...new Set(pages)]);
          if (!text) {
            alert('This page has little or no text to read aloud (it may be a scanned image).');
            return;
          }
          speak(text, listenLang.value || 'gu-IN');
        } finally {
          hideKidsLoader();
        }
      }

      function showEmbedFallback(fileUrl) {
        flipRoot.hidden = true;
        document.getElementById('ebookToolbar').querySelectorAll('.tool, .tool-label, #listenBtn, #listenLang, #stopListenBtn').forEach((el) => {
          el.style.display = 'none';
        });
        embedEl.hidden = false;
        embedEl.src = fileUrl;
        hintEl.textContent = 'Simple reader mode. Redeploy API PDF proxy for full page-flip + Listen.';
      }

      async function bootReader() {
        if (!bookId) {
          titleEl.textContent = 'Book not found';
          metaEl.textContent = 'Open a book from the eBooks library.';
          return;
        }

        showKidsLoader('Opening eBook…');
        try {
          await Promise.all([loadPdfJs(), loadPageFlip()]);
          const book = await loadBook(bookId);
          titleEl.textContent = book.title || 'eBook';
          metaEl.textContent = 'Flip pages like a real book • Listen aloud';
          document.title = `${book.title || 'eBook'} · Alpha 25`;

          if (book.file_url) {
            downloadBtn.hidden = false;
            downloadBtn.href = book.file_url;
          } else {
            throw new Error('No PDF uploaded for this book');
          }

          const buffer = await fetchPdfBuffer(book);
          if (!buffer) {
            showEmbedFallback(book.file_url);
            return;
          }

          pdfDoc = await pdfjsLib.getDocument({ data: buffer }).promise;
          pageImages = await buildPageImages();
          const startIndex = Math.min(Math.max(0, startPage - 1), pageImages.length - 1);
          createFlipBook(pageImages, startIndex);
          hintEl.innerHTML = 'Drag a page corner, swipe, or use Prev/Next — pages turn with a book-flip effect.';
          if (wantListen) listenCurrent();
        } catch (error) {
          titleEl.textContent = 'Could not open book';
          metaEl.textContent = error?.message === 'No PDF uploaded for this book'
            ? 'This eBook has no PDF yet. Upload a PDF from Admin → eBooks.'
            : 'Could not load the PDF. Try Download PDF, or redeploy API and retry Read.';
          console.error(error);
        } finally {
          hideKidsLoader(true);
        }
      }

      document.getElementById('prevBtn').onclick = () => go(-1);
      document.getElementById('nextBtn').onclick = () => go(1);
      mode1Btn.onclick = async () => {
        usePortrait = true;
        setModeButtons();
        await rebuildFlip(page);
      };
      mode2Btn.onclick = async () => {
        usePortrait = false;
        setModeButtons();
        await rebuildFlip(page);
      };
      document.getElementById('listenBtn').onclick = () => listenCurrent();
      document.getElementById('stopListenBtn').onclick = () => window.speechSynthesis?.cancel();
      pageInput.addEventListener('change', () => {
        if (!pageFlip) return;
        const target = Math.min(pageImages.length, Math.max(1, Number(pageInput.value) || 1));
        pageFlip.flip(target - 1, 'top');
      });
      window.addEventListener('keydown', (event) => {
        if (event.target.matches('input, textarea, select')) return;
        if (event.key === 'ArrowLeft' || event.key === 'PageUp') go(-1);
        if (event.key === 'ArrowRight' || event.key === 'PageDown' || event.key === ' ') {
          event.preventDefault();
          go(1);
        }
      });
      window.addEventListener('resize', () => {
        if (!pageFlip || !pageImages.length) return;
        window.clearTimeout(window.__ebookResizeTimer);
        window.__ebookResizeTimer = window.setTimeout(() => rebuildFlip(page), 220);
      });

      bootReader();
    })();
  </script>
</body>
</html>
