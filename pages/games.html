<!DOCTYPE html><html lang="gu"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Balvatika Games</title><link rel="icon" href="../favicon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="../favicon.svg"><link rel="stylesheet" href="../style.css?v=10"></head><body><header class="hero"><div class="brand">🎮 Balvatika Games</div><p>શીખો અને રમો</p></header><nav id="nav"></nav><main class="page"><div id="games" class="grid"></div></main><footer>© Alpha 25 Learning Lab</footer><script src="../app.js?v=10"></script><script>const games=[['🔤','અક્ષર ઓળખો','કક્કો/ABCD માંથી સાચો અક્ષર પસંદ કરો.'],['🔢','અંક ઓળખો','ચિત્ર કે સંખ્યા જોઈને સાચો અંક પસંદ કરો.'],['🖼️','Picture Word','ચિત્ર જોઈને સાચો શબ્દ પસંદ કરો.'],['🔗','Matching','અક્ષર અને શબ્દ/ચિત્રની જોડણી કરો.'],['✏️','માત્રા Practice','કાના અને અન્ય માત્રાવાળા શબ્દોનો અભ્યાસ કરો.']];document.getElementById('games').innerHTML=games.map(g=>`<div class="card game"><h2>${g[0]} ${g[1]}</h2><p>${g[2]}</p><button class="btn" onclick="alert('આ game module માટે interactive question bank અહીં ઉમેરાશે.')">▶ Start</button></div>`).join('');</script></body></html>
